<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-label="Drenyra Skills flow — fiscal knowledge source, versioned skills, agent guidance, verified application boundary">
  <!-- brand-system v0.2 flow banner: theme-aware (dark + light via prefers-color-scheme),
       canonical tokens only (contracts/brand-system/tokens.json), zero embedded text.
       Flow motif: fiscal knowledge source -> versioned skills -> agent guidance ->
       verified application boundary. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop class="g-bg1" offset="0%"/>
      <stop class="g-bg2" offset="55%"/>
      <stop class="g-bg3" offset="100%"/>
    </linearGradient>
    <linearGradient id="flow-c" x1="0" y1="0" x2="1" y2="0">
      <stop class="g-c1" offset="0%"/>
      <stop class="g-c2" offset="100%"/>
    </linearGradient>
    <linearGradient id="flow-v" x1="0" y1="0" x2="1" y2="0">
      <stop class="g-v1" offset="0%"/>
      <stop class="g-v2" offset="100%"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop class="g-card1" offset="0%"/>
      <stop class="g-card2" offset="100%"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="var(--grid)" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    :root {
      --bg1: #0B0E11; --bg2: #12161B; --bg3: #1A1F26;
      --grid: #FFFFFF;
      --glow-c: #3CE6D8; --glow-v: #9B7FE8;
      --c: #3CE6D8; --c-bright: #6AEFE4;
      --v: #9B7FE8; --v-bright: #B8A2F0;
      --ok: #4ADE94;
      --n1: #12161B; --n2: #1A1F26; --n3: #20262E;
      --border: #323A44; --border-subtle: #262C34;
      --muted: #A8B0BC; --muted-dim: #6B7480;
      --pending: #6B9FE8;
      --spark: #6AEFE4;
    }
    .g-bg1 { stop-color: var(--bg1); }
    .g-bg2 { stop-color: var(--bg2); }
    .g-bg3 { stop-color: var(--bg3); }
    .g-c1 { stop-color: var(--c); }
    .g-c2 { stop-color: var(--c-bright); }
    .g-v1 { stop-color: var(--v); }
    .g-v2 { stop-color: var(--v-bright); }
    .g-card1 { stop-color: var(--n1); }
    .g-card2 { stop-color: var(--n2); }
    @media (prefers-color-scheme: light) {
      :root {
        --bg1: #FAFAF9; --bg2: #FFFFFF; --bg3: #F2F2F0;
        --grid: #000000;
        --glow-c: #2ECFC2; --glow-v: #6B54A8;
        --c: #2ECFC2; --c-bright: #1F8A80;
        --v: #6B54A8; --v-bright: #7B66C0;
        --ok: #1A8F52;
        --n1: #FFFFFF; --n2: #F2F2F0; --n3: #FFFFFF;
        --border: #D4D4D0; --border-subtle: #E5E5E2;
        --muted: #52565D; --muted-dim: #7A7F87;
        --pending: #2E5FB8;
        --spark: #1F8A80;
      }
    }
  </style>

  <!-- Background: canvas gradient + blueprint grid + cyan/violet aurora glows -->
  <rect width="1400" height="460" fill="url(#bg)"/>
  <rect width="1400" height="460" fill="url(#grid)"/>
  <circle cx="1150" cy="90" r="280" fill="var(--glow-c)" opacity="0.06"/>
  <circle cx="150" cy="410" r="320" fill="var(--glow-v)" opacity="0.05"/>

  <!-- Node 1: fiscal knowledge source (open folio, cyan spine) -->
  <g>
    <rect x="104" y="190" width="60" height="96" rx="8" fill="var(--n1)" stroke="var(--border-subtle)" stroke-width="1.5"/>
    <rect x="176" y="190" width="60" height="96" rx="8" fill="var(--n2)" stroke="var(--border-subtle)" stroke-width="1.5"/>
    <rect x="164" y="180" width="12" height="116" rx="6" fill="var(--c)" opacity="0.75"/>
    <rect x="114" y="206" width="40" height="7" rx="3.5" fill="var(--muted)" opacity="0.5"/>
    <rect x="114" y="222" width="30" height="7" rx="3.5" fill="var(--muted)" opacity="0.35"/>
    <rect x="186" y="206" width="34" height="7" rx="3.5" fill="var(--muted)" opacity="0.4"/>
    <rect x="186" y="222" width="40" height="7" rx="3.5" fill="var(--muted)" opacity="0.35"/>
    <circle cx="170" cy="178" r="4" fill="var(--spark)"/>
  </g>

  <!-- Flow: source -> versioned skills (cyan) -->
  <path d="M 240 235 C 310 235 370 235 440 235" fill="none" stroke="url(#flow-c)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 432 228 L 446 235 L 432 242 Z" fill="var(--c)"/>
  <circle cx="340" cy="235" r="3" fill="var(--spark)" opacity="0.9"/>

  <!-- Node 2: versioned skills (stacked folios + version dots + sigil) -->
  <g>
    <rect x="490" y="186" width="150" height="104" rx="10" fill="var(--n3)" stroke="var(--border-subtle)"/>
    <rect x="510" y="176" width="150" height="104" rx="10" fill="var(--n2)" stroke="var(--border-subtle)"/>
    <rect x="530" y="166" width="150" height="104" rx="10" fill="var(--n1)" stroke="var(--border)" stroke-width="1.5"/>
    <rect x="536" y="172" width="4" height="92" rx="2" fill="var(--c)" opacity="0.8"/>
    <rect x="632" y="192" width="4" height="92" rx="2" fill="var(--v)" opacity="0.55"/>
    <circle cx="520" cy="204" r="5" fill="var(--v)" opacity="0.45"/>
    <circle cx="540" cy="194" r="5" fill="var(--v)" opacity="0.7"/>
    <circle cx="560" cy="184" r="10" fill="none" stroke="var(--v)" stroke-width="2" opacity="0.8"/>
    <circle cx="560" cy="184" r="4" fill="var(--v-bright)"/>
    <path d="M 578 228 C 592 218 578 212 592 202" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="592" cy="202" r="3" fill="var(--spark)"/>
    <rect x="544" y="252" width="88" height="7" rx="3.5" fill="var(--muted)" opacity="0.4"/>
    <rect x="544" y="266" width="64" height="7" rx="3.5" fill="var(--muted)" opacity="0.3"/>
  </g>

  <!-- Flow: versioned skills -> agent guidance (cyan) -->
  <path d="M 684 235 C 740 235 790 235 830 235" fill="none" stroke="url(#flow-c)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 822 228 L 836 235 L 822 242 Z" fill="var(--c)"/>
  <circle cx="760" cy="235" r="3" fill="var(--spark)" opacity="0.9"/>

  <!-- Node 3: agent guidance (target rings + violet orbit arc) -->
  <g>
    <circle cx="890" cy="235" r="52" fill="none" stroke="var(--c)" stroke-width="2.5"/>
    <circle cx="890" cy="235" r="34" fill="none" stroke="var(--c)" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="890" cy="235" r="14" fill="var(--c)"/>
    <path d="M 890 169 A 66 66 0 0 1 956 235" fill="none" stroke="var(--v)" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="924" cy="176" r="3.5" fill="var(--spark)"/>
  </g>

  <!-- Flow: agent guidance -> verified application boundary (violet) -->
  <path d="M 948 235 C 1010 235 1050 235 1121 235" fill="none" stroke="url(#flow-v)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1113 228 L 1127 235 L 1113 242 Z" fill="var(--v)"/>
  <circle cx="1035" cy="235" r="3" fill="var(--v-bright)" opacity="0.9"/>

  <!-- Node 4: verified application boundary (archway + green check at crown) -->
  <g>
    <path d="M 1125 175 A 70 70 0 0 1 1265 175 L 1265 300 L 1125 300 Z" fill="var(--n1)" stroke="var(--border)" stroke-width="1.5"/>
    <path d="M 1137 180 A 58 58 0 0 1 1253 180" fill="none" stroke="var(--v)" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="1195" cy="138" r="22" fill="var(--ok)" opacity="0.14" stroke="var(--ok)" stroke-width="2"/>
    <path d="M 1186 138 L 1192 144 L 1204 131" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1195" cy="168" r="3" fill="var(--spark)"/>
    <circle cx="1272" cy="182" r="5" fill="var(--ok)"/>
  </g>
</svg>
