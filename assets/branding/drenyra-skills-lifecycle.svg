<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<rect width="1400" height="460" fill="#f3eadc"/>
<text x="64" y="50" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2.0">SKILL LIFECYCLE</text>
<text x="64" y="96" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">From source to pinned capability</text>
<text x="64" y="128" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">Normative knowledge is authored, reviewed, versioned, validated, and pinned before use.</text>

<line x1="95" y1="250" x2="1300" y2="250" stroke="#3e2f20" stroke-width="1.6"/>
<g transform="translate(105 250)">
      <circle r="19" fill="#fff7ea" stroke="#824f16" stroke-width="2.3"/><circle r="5" fill="#824f16"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">SOURCE</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">normative basis</text>
    </g><g transform="translate(300 250)">
      <circle r="19" fill="#fff7ea" stroke="#a7471c" stroke-width="2.3"/><circle r="5" fill="#a7471c"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">AUTHOR</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">skill document</text>
    </g><g transform="translate(500 250)">
      <circle r="19" fill="#fff7ea" stroke="#57478b" stroke-width="2.3"/><circle r="5" fill="#57478b"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">REVIEW</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">domain review</text>
    </g><g transform="translate(700 250)">
      <circle r="19" fill="#fff7ea" stroke="#0d4a68" stroke-width="2.3"/><circle r="5" fill="#0d4a68"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">VERSION</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">manifest entry</text>
    </g><g transform="translate(900 250)">
      <circle r="19" fill="#fff7ea" stroke="#315b31" stroke-width="2.3"/><circle r="5" fill="#315b31"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">CONFORMANCE</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">schema + checksum</text>
    </g><g transform="translate(1095 250)">
      <circle r="19" fill="#fff7ea" stroke="#0d4a68" stroke-width="2.3"/><circle r="5" fill="#0d4a68"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">PIN</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">runtime copy</text>
    </g><g transform="translate(1285 250)">
      <circle r="19" fill="#fff7ea" stroke="#315b31" stroke-width="2.3"/><circle r="5" fill="#315b31"/>
      <text x="0" y="-48" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">CONSUME</text>
      <text x="0" y="55" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">agent context</text>
    </g>
<g transform="translate(64 362)">
  <rect width="1272" height="54" rx="10" fill="#fff7ea" stroke="#8a7358"/>
  <text x="18" y="22" fill="#824f16" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.1">IMMUTABLE IN MISSION</text>
  <text x="250" y="22" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.1">VERSIONED PER SKILL</text>
  <text x="500" y="22" fill="#315b31" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.1">JURISDICTION-SCOPED</text>
  <text x="765" y="22" fill="#57478b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.1">ROLLBACK-ABLE</text>
  <text x="985" y="22" fill="#842f24" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.1">NO SILENT DRIFT</text>
  <text x="18" y="44" fill="#554638" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" text-anchor="start" letter-spacing="0">a normative update changes new missions — never rewrites the past</text>
</g>
</svg>